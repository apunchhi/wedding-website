<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="petal" x1="16" y1="4" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".55" stop-color="#f9f4e4" />
      <stop offset="1" stop-color="#dfd8c0" />
    </linearGradient>

    <!-- narrow, slightly cupped jasmine petal -->
    <path
      id="jl"
      d="M16 16c-3.2-1.9-4.4-5.3-3.3-8.4.7-1.9 1.9-3.1 3.3-3.1s2.6 1.2 3.3 3.1c1.1 3.1-.1 6.5-3.3 8.4z"
    />
    <path
      id="js"
      d="M16 15.4c-2.3-1.4-3.1-3.9-2.4-6.1.5-1.4 1.4-2.2 2.4-2.2s1.9.8 2.4 2.2c.7 2.2-.1 4.7-2.4 6.1z"
    />
  </defs>

  <!-- eight petals: mogra reads as white, so it needs a sage edge on cream paper -->
  <g fill="url(#petal)" stroke="#6f8050" stroke-opacity=".85" stroke-width="1" stroke-linejoin="round">
    <use href="#jl" />
    <use href="#jl" transform="rotate(45 16 16)" />
    <use href="#jl" transform="rotate(90 16 16)" />
    <use href="#jl" transform="rotate(135 16 16)" />
    <use href="#jl" transform="rotate(180 16 16)" />
    <use href="#jl" transform="rotate(225 16 16)" />
    <use href="#jl" transform="rotate(270 16 16)" />
    <use href="#jl" transform="rotate(315 16 16)" />
  </g>

  <g fill="#fffdf6" stroke="#6f8050" stroke-opacity=".6" stroke-width=".85" stroke-linejoin="round">
    <use href="#js" transform="rotate(22.5 16 16)" />
    <use href="#js" transform="rotate(112.5 16 16)" />
    <use href="#js" transform="rotate(202.5 16 16)" />
    <use href="#js" transform="rotate(292.5 16 16)" />
  </g>

  <circle cx="16" cy="16" r="3" fill="#f0cb55" stroke="#b8912c" stroke-width=".7" />
  <circle cx="16" cy="16" r="1.2" fill="#a8801f" />
</svg>
