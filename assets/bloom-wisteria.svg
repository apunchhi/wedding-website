<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="outer" cx="50%" cy="78%" r="70%">
      <stop offset="0" stop-color="#c3aada" />
      <stop offset=".55" stop-color="#a483c4" />
      <stop offset="1" stop-color="#7e5c9e" />
    </radialGradient>
    <radialGradient id="upper" cx="50%" cy="80%" r="70%">
      <stop offset="0" stop-color="#d6c6e6" />
      <stop offset="1" stop-color="#ab8dc8" />
    </radialGradient>

    <!-- rounded petal with a soft crease down the middle -->
    <path
      id="wl"
      d="M16 16c-3.9-1.6-5.5-5-4.9-8.3.5-2.6 2.5-4.5 4.9-4.5s4.4 1.9 4.9 4.5c.6 3.3-1 6.7-4.9 8.3z"
    />
    <path
      id="ws"
      d="M16 15c-2.7-1.1-3.8-3.6-3.4-5.8.4-1.8 1.7-3.1 3.4-3.1s3 1.3 3.4 3.1c.4 2.2-.7 4.7-3.4 5.8z"
    />
    <path id="crease" d="M16 4.2v10.4" stroke="#6f4d90" stroke-opacity=".3" stroke-width=".7" fill="none" />
  </defs>

  <!-- five broad petals, the classic open aster face -->
  <g fill="url(#outer)">
    <use href="#wl" />
    <use href="#wl" transform="rotate(72 16 16)" />
    <use href="#wl" transform="rotate(144 16 16)" />
    <use href="#wl" transform="rotate(216 16 16)" />
    <use href="#wl" transform="rotate(288 16 16)" />
  </g>
  <g>
    <use href="#crease" />
    <use href="#crease" transform="rotate(72 16 16)" />
    <use href="#crease" transform="rotate(144 16 16)" />
    <use href="#crease" transform="rotate(216 16 16)" />
    <use href="#crease" transform="rotate(288 16 16)" />
  </g>

  <!-- inner whorl sits in the gaps, lifting the centre forward -->
  <g fill="url(#upper)" opacity=".95">
    <use href="#ws" transform="rotate(36 16 16)" />
    <use href="#ws" transform="rotate(108 16 16)" />
    <use href="#ws" transform="rotate(180 16 16)" />
    <use href="#ws" transform="rotate(252 16 16)" />
    <use href="#ws" transform="rotate(324 16 16)" />
  </g>

  <!-- stamens -->
  <g stroke="#e8c23a" stroke-width="1.1" stroke-linecap="round">
    <path d="M16 16l-2.2-2.6" />
    <path d="M16 16l2.2-2.6" />
    <path d="M16 16l0-3.4" />
    <path d="M16 16l-3-1" />
    <path d="M16 16l3-1" />
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#f0c43c" />
  <circle cx="16" cy="16" r=".7" fill="#b58a18" />
</svg>
